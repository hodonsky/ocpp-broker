# Global NGINX configuration
env NETWORK_DB_HTTP_PROTOCOL;
env NETWORK_DB_HOSTNAME;
env NETWORK_DB_HTTP_PORT;
env NETWORK_DB_USERNAME;
env NETWORK_DB_PASSWORD;

error_log /dev/stderr info;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    lua_package_path "/usr/local/openresty/luajit/share/lua/5.1/?.lua;/usr/local/openresty/site/lualib/?.lua;/usr/local/openresty/lualib/?.lua;;";
    access_log /dev/stdout;
    error_log /dev/stderr info;

    resolver 127.0.0.11 valid=30s;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:AES128-SHA:AES256-SHA';
    ssl_prefer_server_ciphers on;

    server {
        listen 8443 ssl;
        server_name nginx;

        # SSL certificate paths
        ssl_certificate /etc/ssl/certs/broker.crt;
        ssl_certificate_key /etc/ssl/certs/broker.key;

        set $target_url "";
        set $host_name "";

        location ~ ^/evse/connect(/.*)?$ {
          content_by_lua_block {
            local http = require "resty.http"
            local ws_proxy = require "resty.websocket.proxy"

            local httpc = http.new()
            
            local network_db_protocol = tostring(os.getenv("NETWORK_DB_HTTP_PROTOCOL") or "undefined" )
            local network_db_hostname = tostring(os.getenv("NETWORK_DB_HOSTNAME") or "undefined" )
            local network_db_port     = tostring(os.getenv("NETWORK_DB_HTTP_PORT") or "undefined" )
            local network_db_username = tostring(os.getenv("NETWORK_DB_USERNAME") or "undefined" )
            local network_db_password = tostring(os.getenv("NETWORK_DB_PASSWORD") or "undefined" )

            if not network_db_protocol or not network_db_username or not network_db_password or not network_db_hostname or not network_db_port then
                ngx.log( ngx.ERR, "Environment variables may not be set." )
                return ngx.exit( ngx.HTTP_INTERNAL_SERVER_ERROR )
            end
            
            local res, err = httpc:request_uri( network_db_protocol .. "://" .. network_db_hostname .. ":" .. network_db_port .."/db/neo4j/tx/commit", {
                method = "POST",
                headers = {
                    ["Content-Type"] = "application/json",
                    ["Authorization"] = "Basic " .. ngx.encode_base64(network_db_username .. ":" .. network_db_password),
                },
                body = [[ { "statements": [ { "statement": "MATCH (o:ocppService) RETURN o.hostname, o.wsport, o.cert LIMIT 1" } ] } ]]
            })

            if not res then
                ngx.status = ngx.HTTP_INTERNAL_SERVER_ERROR
                ngx.log(ngx.ERR, "Failed to query Neo4j: " .. err)
                return
            end
            
            local cjson = require "cjson"
            local response_data = cjson.decode(res.body)

            if response_data.errors and next(response_data.errors) ~= nil then
                ngx.log(ngx.ERR, "Response data contains errors.")
                for _, err in ipairs(response_data.errors) do
                    ngx.log(ngx.ERR, "Neo4j Error Code: ", err.code, " Message: ", err.message)
                end
                ngx.status = ngx.HTTP_INTERNAL_SERVER_ERROR
                return
            end

            local ocpp_service_hostname = response_data.results[1].data[1].row[1]
            local ocpp_service_wsport = response_data.results[1].data[1].row[2]
            local ocpp_service_cert = response_data.results[1].data[1].row[3]

            -- ------------------------------- --
            
            local cert_path = "/etc/ssl/certs/" .. ocpp_service_hostname .. ngx.now() ..".crt"
            local file, err = io.open(cert_path, "w")
            if not file then
                ngx.status = ngx.HTTP_INTERNAL_SERVER_ERROR
                ngx.log(ngx.ERR, "Failed to open file: ", err)
                return 
            end
            
            if type( ocpp_service_cert ) ~= "string" then
                ngx.log(ngx.ERR, "ERROR: ocpp_service_cert should be a string but got " .. type(ocpp_service_cert))
                return ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
            end

            file:write( ocpp_service_cert )
            file:close()

            local target_url = "wss://" .. ocpp_service_hostname .. ":" .. ocpp_service_wsport .. ngx.var.request_uri
            local proxy, err = ws_proxy.new({
                ssl_server_name = ocpp_service_hostname,
                ssl_verify = true,
                ssl_trusted_certificate = cert_path,
                debug = true
            })

            if not proxy then
                ngx.log(ngx.ERR, "Failed to initialize WebSocket proxy: ", err)
                return ngx.exit(ngx.HTTP_INTERNAL_SERVER_ERROR)
            end
            
            local ok, err = proxy:connect(target_url)
            if not ok then
                ngx.log(ngx.ERR, err)
                return ngx.exit(444)
            end

            local done, err = proxy:execute()
            if not done then
                ngx.log(ngx.ERR, "failed proxying: ", err)
                return ngx.exit(444)
            end

            os.remove(cert_path)
          }
        }
        location ~ ^/evse/command/(?<evse_serial_number>[^/]+)$ {
          content_by_lua_block {
            local evse_serial_number = ngx.var.evse_serial_number
            local query_string = ngx.var.args or ""


            local http = require "resty.http"
            local ws_proxy = require "resty.websocket.proxy"

            local httpc = http.new()
            
            local network_db_protocol = os.getenv("NETWORK_DB_PROTOCOL")
            local network_db_hostname = os.getenv("NETWORK_DB_HOSTNAME")
            local network_db_port     = os.getenv("NETWORK_DB_PORT")
            local network_db_username = os.getenv("NETWORK_DB_USERNAME")
            local network_db_password = os.getenv("NETWORK_DB_PASSWORD")

            if not network_db_protocol or not network_db_username or not network_db_password or not network_db_hostname or not network_db_port then
                ngx.log(ngx.ERR, "Environment variables NETWORK_DB_PROTOCOL, NETWORK_DB_HOSTNAME, NETWORK_DB_POST, NETWORK_DB_USERNAME, or NETWORK_DB_PASSWORD are not set.")
                ngx.status = ngx.HTTP_INTERNAL_SERVER_ERROR
                return
            end

            local res, err = httpc:request_uri( network_db_protocol .. "://" .. network_db_hostname .. ":" .. network_db_port .."/db/neo4j/tx/commit", {
                method = "POST",
                headers = {
                    ["Content-Type"] = "application/json",
                    ["Authorization"] = "Basic " .. ngx.encode_base64(network_db_username .. ":" .. network_db_password),
                },
                body = [[ { "statements": [ { "statement": "MATCH (o:ocppService)->(e:evse{serialNumber:'" .. evse_serial_number .. "'}) RETURN o.hostname, o.port LIMIT 1" } ] } ]]
            })

            if not res then
                ngx.status = ngx.HTTP_BAD_GATEWAY
                ngx.say("Error: " .. (err or "Unknown error"))
                return ngx.exit(ngx.HTTP_BAD_GATEWAY)
            end

            local ocpp_service_hostname = response_data.results[1].data[1].row[1]
            local ocpp_service_wsport = response_data.results[1].data[1].row[2]

            local backend_url = "https://" .. ocpp_service_hostname .. ":" .. ocpp_service_wsport .. "/evse/command/" .. evse_serial_number

            if query_string ~= "" then
                backend_url = backend_url .. "?" .. query_string
            end

            -- Make the request
            local res, err = httpc:request_uri( backend_url, {
                method  = ngx.req.get_method(),
                body    = ngx.req.get_body_data(),
                headers = ngx.req.get_headers()
            })

            if not res then
                ngx.status = ngx.HTTP_BAD_GATEWAY
                ngx.say("Error: " .. (err or "Unknown error"))
                return ngx.exit(ngx.HTTP_BAD_GATEWAY)
            end

            -- Forward response
            ngx.status = res.status
            for k, v in pairs(res.headers) do
                ngx.header[k] = v
            end
            ngx.say(res.body)
          }
        }
    }
}